[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "measured"
description = "Fast and Pythonic library for working with measurements and quantities"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Chris Guidry", email = "chris@theguidrys.us" }]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/chrisguidry/measured"
"Bug Tracker" = "https://github.com/chrisguidry/measured/issues"

[project.scripts]
measured = "measured.cli:main"

[project.entry-points.pytest11]
measured = "measured.pytest"

[dependency-groups]
dev = [
    # cloudpickle's PyPy code path subclasses the pure-Python pickle.Pickler,
    # which PyPy no longer provides, so the import fails there
    'cloudpickle; implementation_name=="cpython"',
    "codespell",
    "fastapi",
    "httpx",
    "hypothesis",
    "icecream",
    "ipython",
    "jupyter",
    "lark",
    "loq",
    'memray; implementation_name=="cpython"',
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "prek",
    # mkdocstrings 1.0.8 still calls pymdownx Highlight without the md
    # argument that pymdown-extensions 12 requires, so the docs build fails.
    "pymdown-extensions<13",
    "pydantic>2",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-benchmark",
    "pytest-cov<7",  # 7.x starts measuring after the pytest11 entry point imports measured
    "pytest-xdist",
    "ruff",
    "snakeviz",
    "sqlalchemy",
    "typer",
    "tuna",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/measured"]

[tool.coverage.run]
omit = [
    "src/measured/_parser.py",
    "src/measured/pytest.py",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# ruff's default rules before 0.15, plus isort's import ordering
select = ["E4", "E7", "E9", "F", "I"]
# Physics names its quantities with single letters, such as I for current.
ignore = ["E741"]
# lark generates this module from measured.lark
exclude = ["src/measured/_parser.py"]

[tool.ruff.lint.per-file-ignores]
# The notebooks explore the whole namespace with star imports.
"tests/notebooks/*.ipynb" = ["F403", "F405"]

[tool.pyright]
include = ["src", "tests"]
# pyright infers different types from lark's generated parser on newer Pythons,
# so it checks against the oldest supported version whatever the interpreter.
pythonVersion = "3.11"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
# lark generates this module from measured.lark
ignore = ["src/measured/_parser.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "7.1"
addopts = """
    -n auto
    --maxprocesses 4
    --doctest-modules
    --cov=src
    --cov=tests
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=100
    --no-cov-on-fail
"""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "default",
    # warnings from lark-generated parser module
    "ignore:module 'sre_parse' is deprecated:DeprecationWarning",
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning",
]

[tool.codespell]
# Unit names (the smoot, the light-year, the bushel's "bu.") and a test's
# made-up unit
ignore-words-list = "smoot,lightyear,bu,gud"
