# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  # The docs build installs the dev dependency group from uv.lock.
  commands:
    - pip install uv
    - uv sync --frozen
    - uv run mkdocs build --site-dir $READTHEDOCS_OUTPUT/html --config-file mkdocs.yml
