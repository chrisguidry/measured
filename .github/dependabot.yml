version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # pytest-cov 7 starts measuring after the pytest11 entry point has
      # imported measured, so coverage misses every module-level line.
      - dependency-name: "pytest-cov"
        versions: [">=7"]
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"
