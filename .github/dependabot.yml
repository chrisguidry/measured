# Terraform writes this file from github.com/chrisguidry/.github, and
# writes it again over any change made here. To change it, edit this
# repository's entry in repositories.yaml there.

version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    # A release has a week to be found bad and yanked before it lands here.
    cooldown:
      default-days: 7
    # One pull request a week carries every update of this ecosystem.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directories: ["/"]
    schedule:
      interval: weekly
    # A release has a week to be found bad and yanked before it lands here.
    cooldown:
      default-days: 7
    # One pull request a week carries every update of this ecosystem.
    groups:
      uv:
        patterns: ["*"]
    # Without this, Dependabot updates only the packages that
    # pyproject.toml names, and the rest of uv.lock goes stale.
    allow:
      - dependency-type: all
    # This project is a library, so only uv.lock moves, and the
    # requirements in pyproject.toml stay as low as it supports.
    versioning-strategy: lockfile-only
    ignore:
      # pytest-cov 7 starts measuring after the pytest11 entry point
      # has imported measured, so coverage misses every module-level
      # line.
      - dependency-name: "pytest-cov"
        versions: [">=7"]
      # measured caps pymdown-extensions below 13 for its docs
      # build, and 13 needs Python 3.11.5 where measured supports
      # 3.11, so an update to it does not resolve.
      - dependency-name: "pymdown-extensions"
        versions: [">=13"]
