name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.14"
        - "3.13"
        - "3.12"
        - "3.11"
        - "3.10"
        - "pypy3.11"
        include:
          - coverage: true
            coverageArgument: --cov-report xml
          - python-version: "pypy3.11"
            coverage: false
            coverageArgument: --no-cov

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: 'pyproject.toml'

    - run: python -m pip install --upgrade pip build

    - run: python -m build

    - run: pip install -e '.[dev]'

    - run: pytest ${{ matrix.coverageArgument }}

    - if: matrix.python-version == '3.14'
      run: pre-commit run --all-files

    - uses: codecov/codecov-action@v5
      if: ${{ matrix.coverage }}
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: python-${{ matrix.python-version }}
        # pytest enforces the coverage gate with --cov-fail-under=100. Codecov
        # is reporting, and tokenless uploads get rate limited, so a failed
        # upload must not fail the build.
        fail_ci_if_error: false
        verbose: true
