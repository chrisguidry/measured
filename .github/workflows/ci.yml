name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11"]
        include:
          - coverage-argument: --cov-report=xml
          - python-version: "pypy3.11"
            coverage-argument: --no-cov

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: >
          uv run pytest
          ${{ matrix.coverage-argument }}
          --junitxml=junit.xml
          -o junit_family=legacy

      # pytest enforces the coverage gate with --cov-fail-under=100. Codecov
      # is reporting, and tokenless uploads get rate limited, so a failed
      # upload must not fail the build.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.python-version != 'pypy3.11' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  prek:
    name: Prek checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Run prek
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1

  # The one check main's ruleset requires. It succeeds only when every job
  # it needs succeeded, so a job added to or renamed in this workflow counts
  # without a change to the ruleset.
  all-checks-passed:
    name: All checks passed
    if: ${{ always() }}
    needs: [test, prek]
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - name: Fail unless every needed job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
